apiVersion: apps/v1
kind: Deployment
metadata:
  name: dflow-deployment
  labels:
    app: dflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dflow
  template:
    metadata:
      labels:
        app: dflow
    spec:
      imagePullSecrets:
        - name: model-registry-creds
      containers:
      - name: dflow
        image: REGISTRY/PROJECT/dflow:lastest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: minio-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: dflow-service
spec:
  type: LoadBalancer   # Use LoadBalancer for cloud clusters, or NodePort/ClusterIP for local
  selector:
    app: dflow
  ports:
  - protocol: TCP
    port: 8000          # Port exposed to the outside
    targetPort: 8000   # Port uvicorn is listening on inside the container