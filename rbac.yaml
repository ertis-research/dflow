---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: bentloy-test
  name: job-creator-role
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-creator-binding
  namespace: bentloy-test
subjects:
- kind: ServiceAccount
  name: default
  namespace: bentloy-test
roleRef:
  kind: Role
  name: job-creator-role
  apiGroup: rbac.authorization.k8s.io